# Wire both hook types on `pre-commit install`. `default_stages` keeps every
# hook below on the commit stage unless it opts into pre-push explicitly, so
# nothing runs twice: fast checks gate each commit, the full test suite gates
# each push. After pulling this change, run `pre-commit install` once to
# register the pre-push hook.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Security + basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: local
    hooks:
      # Reject literal control bytes in source. A NUL written into a string
      # literal is legal JS/Python and sails past prettier, eslint,
      # svelte-check and the test suites -- but git treats any file with a NUL
      # in its first 8000 bytes as binary, so it renders as "Bin N -> M bytes"
      # in every diff and becomes unreviewable. That happened once already: a
      # NUL stood in for a space in a `.join(...)` separator and survived four
      # commits, because the only signal was git's diff view and nothing ever
      # emitted an error.
      #
      # Tab, LF and CR are allowed; anything else in the C0 range (plus DEL)
      # belongs in source as an escape sequence, never as a raw byte.
      #
      # types:[text] uses identify's extension-based classification, which
      # scans .ts/.py/.md and skips the PNG/AVIF/WOFF2 under frontend/static/.
      # Do NOT swap this for git's own binary detection: `git grep -I` skips
      # exactly the poisoned file we're hunting, since the poison is what makes
      # git call it binary. Likewise don't reach for .gitattributes -- marking
      # these paths `text` would restore the readable diff while leaving the
      # byte in place, deleting the symptom rather than the cause.
      - id: forbid-control-characters
        name: forbid control characters in text files
        entry: '[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]'
        language: pygrep
        types: [text]

  # Local hooks (use system Node to avoid nodeenv/Node 24 incompatibility)
  - repo: local
    hooks:
      # Markdown — formatting + linting.
      # Invoke the binaries installed in frontend/node_modules directly so
      # versions stay pinned by frontend/package.json + pnpm-lock.yaml
      # (instead of re-downloading via npx on every run).
      - id: prettier-markdown
        name: prettier (markdown)
        entry: frontend/node_modules/.bin/prettier --write
        language: system
        types: [markdown]
        # frontend markdown is handled by prettier-markdown-frontend: its
        # .prettierrc loads prettier-plugin-svelte, which only resolves with
        # frontend/ as the working directory.
        exclude: ^(CLAUDE\.md|AGENTS\.md|frontend/)
      - id: prettier-markdown-frontend
        name: prettier (markdown, frontend)
        entry: bash -c 'cd frontend && exec node_modules/.bin/prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.md$
        types: [markdown]
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: frontend/node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]
        exclude: ^(CLAUDE\.md|AGENTS\.md|docs/plans/.*)$
      # Python (backend) — use project's ruff via uv so pre-commit and CI
      # always run the identical binary (avoids platform formatting drift).
      # pass_filenames: false so ruff checks all backend files every time,
      # catching formatting issues from earlier commits too.
      # check --fix and format are combined into a single uv invocation to
      # avoid paying uv's cold-start cost twice.
      - id: ruff
        name: ruff check + format
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/
        pass_filenames: false
      # Import boundary enforcement (import-linter). Contracts live in
      # backend/pyproject.toml [tool.importlinter]; spec is docs/AppBoundaries.md.
      # pass_filenames: false so the full import graph is analyzed every time.
      - id: import-linter
        name: import-linter (app boundaries)
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        # Re-validate on any backend .py change OR an edit to the contracts.
        files: (^backend/.*\.py$|^backend/pyproject\.toml$)
        pass_filenames: false
      # Static type checking via mypy (with django-stubs plugin) in daemon mode.
      # dmypy holds the project type graph in memory across commits — cold start
      # is slow (~30-60s) but every subsequent run is fast and full-project.
      # If the daemon gets out of sync: run `make mypy-restart`.
      - id: mypy
        name: mypy (dmypy)
        entry: ./scripts/dmypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: '(pnpm-lock\.yaml|uv\.lock)$'

  - repo: local
    hooks:
      # Auto-regenerate agent docs when source or build script changes
      - id: agent-docs-regen
        name: regenerate agent docs
        entry: bash -c 'python3 scripts/build_agent_docs.py && git add CLAUDE.md AGENTS.md'
        language: system
        files: ^(docs/AGENTS\.src\.md|scripts/build_agent_docs\.py)$
        pass_filenames: false

      # Block direct edits to generated agent docs (unless source or script also changed)
      - id: agent-docs-no-direct-edit
        name: check agent docs not edited directly
        entry: scripts/check_agent_docs_edit.sh
        language: script
        files: ^(CLAUDE|AGENTS)\.md$
        pass_filenames: false

      # Frontend, split across two git stages like the backend tests:
      #   commit -> lint only. It autofixes formatting/style (prettier --write),
      #             which is exactly what you want applied before a commit.
      #   push   -> type check + vitest. svelte-check has no daemon (unlike
      #             backend mypy/dmypy) so it's a ~40s cold check, and vitest's
      #             jsdom setup dominates the ~85s suite. Both are expensive
      #             comprehensive verification -> run once per push, not per commit.
      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-check
        name: frontend type check
        entry: bash -c 'cd frontend && pnpm check'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-test
        name: frontend tests
        entry: bash -c 'cd frontend && pnpm test'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
      # Backend tests, split across git stages:
      #   commit -> the suite, parallelized by `-n auto` in backend/pytest.ini.
      #   push   -> the same suite again, as the comprehensive gate for the code
      #             being pushed (pre-commit-stage hooks don't re-run on push).
      - id: backend-test
        name: backend tests
        entry: uv run --directory backend pytest
        language: system
        files: ^backend/
        pass_filenames: false
      - id: backend-test-push
        name: backend tests
        entry: uv run --directory backend pytest
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]
