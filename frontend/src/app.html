<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/images/favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/images/favicon/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- iOS home-screen label. Safari ignores the manifest's short_name here and
         falls back to the document <title>, which is the long site title. -->
    <meta name="apple-mobile-web-app-title" content="Flipcommons" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only the latin-roman subset is preloaded. Italic and latin-ext
         are loaded lazily by the @font-face unicode-range matcher when
         actually needed, so preloading them would waste bandwidth on
         most page loads. Do not add the other three subsets here. -->
    <link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Critical default-theme background inlined to prevent flash on
         pre-rendered pages. Values must stay in sync with app.css.
         Manual themes (set by ThemeSwitcher) are test-only and tolerate
         a brief flash while their CSS chunk loads; no FOUC wiring here. */
      html {
        background-color: #f9f1df;
        color: #241f19;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background-color: #211d18;
          color: #eadfcb;
        }
      }
      /* SvelteKit's hydration root needs a stable DOM parent under <body>
         but no layout impact. `display: contents` makes the wrapper
         transparent to flow. Lives in this <style> block (which is
         covered by the sha256 in svelte.config.js — see
         computeAppHtmlStyleHash) rather than as an inline style="…"
         attribute, because attributes would require style-src-attr
         'unsafe-hashes' which we don't want to grant. */
      .sk-root {
        display: contents;
      }
    </style>
    <meta name="theme-color" content="#f9f1df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211d18" media="(prefers-color-scheme: dark)" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="sk-root">%sveltekit.body%</div>
  </body>
</html>
