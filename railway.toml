# Railway platform config
# https://docs.railway.com/guides/config-as-code

[build]
dockerfilePath = "Dockerfile"
# When updating watchPatterns, also update paths-ignore in .github/workflows/ci.yml
watchPatterns = [
  "**",
  "!**/*.md",
  "!docs/**",
  "!.github/**",
  "!.claude/**",
  "!.vscode/**",
  "!.coderabbit.yaml",
  "!.pre-commit-config.yaml",
  "!.env.example",
  "!.gitignore",
  "!LICENSE",
]

[deploy]
# Container restart policy. These are the values the prod Web service already
# runs with — declared here so they are reviewable and survive a dashboard
# edit, not to change behavior.
#
# The retry budget is cumulative across a deployment's whole life and never
# resets on healthy running, so ON_FAILURE/10 means a deployment stops for
# good on its eleventh crash however far apart those crashes are; recovery
# then needs a *redeploy*, since a restart re-enters the exhausted deployment.
# Raising the number buys time between hard outages without removing them.
# See https://github.com/The-Flip/flipcommons/issues/726.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# scripts/predeploy runs check --deploy then migrate, in that order. Do NOT
# inline `check --deploy && migrate` here again: an && chain in this config
# string is unreliable — only the first command ran, so migrations were
# silently skipped for ~3.5 weeks (the schema froze ~14 migrations behind the
# code). The script runs both in a real shell under set -e, streams unbuffered
# output to the deploy logs and documents the ordering rationale. check --deploy
# still fails the deploy on Error-level findings (HSTS, SSL,
# RATE_LIMIT_TRUST_PROXY_HEADERS); warnings stay non-blocking.
# See docs/Hosting.md § "Client IP trust".
preDeployCommand = "/app/scripts/predeploy"

# Gate each release on the app actually serving. Railway probes this path
# after preDeployCommand and holds the deployment out of rotation until it
# returns 200, so a container that builds but can't serve never takes traffic.
#
# The path must be the SvelteKit one, not Django's /api/health. Railway sends
# `Host: healthcheck.railway.app`, and /__health terminates at Node, which
# re-originates the Django hop against INTERNAL_API_BASE_URL — so Django sees
# `Host: 127.0.0.1` and the probe never reaches ALLOWED_HOSTS. Pointing this
# at /api/health instead puts the probe's Host in front of that check and
# every deploy fails with a 400 DisallowedHost.
#
# The timeout covers Gunicorn, Node and Caddy starting in sequence (see
# scripts/start-production) plus the /api/health `SELECT 1`. Railway's default
# is 300s; it's stated here so shrinking it is a deliberate edit.
healthcheckPath = "/__health"
healthcheckTimeout = 300
