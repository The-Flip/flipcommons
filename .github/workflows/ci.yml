name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
              - '.pre-commit-config.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - '.pre-commit-config.yaml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy --config-file pyproject.toml .
      - run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  api-types:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --frozen
      - run: cd backend && uv run python manage.py export_openapi_schema
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm api:gen
      - name: Verify types were generated
        run: test -f frontend/src/lib/api/schema.d.ts
      - name: Svelte type check
        run: cd frontend && pnpm check

  # Deliberately NOT behind `needs: changes`. The paths filter above covers
  # backend/, frontend/, scripts/ and a few root files -- a docs-only PR would
  # skip it, and docs/ is squarely in this check's blast radius. It scans the
  # whole tree in ~2s, so there is nothing to gain by narrowing it.
  #
  # Duplicates the local pre-commit hook on purpose: the local hook is the fast
  # feedback loop, this is the merge gate that survives --no-verify and clones
  # that never ran `pre-commit install`. Selecting the single pygrep hook builds
  # no hook environments, so the job is just pip + a tree scan.
  control-characters:
    name: control characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Any modern Python runs pre-commit; deliberately not pinned to
      # backend/.python-version, since coupling a merge-blocking job to an
      # exact patch release buys nothing and fails the moment that patch
      # leaves the runner manifest.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install pre-commit
      - run: pre-commit run forbid-control-characters --all-files

  ci:
    if: always()
    needs: [backend, frontend, api-types, control-characters]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed or were skipped"
