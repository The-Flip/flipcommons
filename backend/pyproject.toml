[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.1",
    "django-ninja>=1.3,<2",
    "dj-database-url>=2.3",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "django-constance>=4.0",
    "markdown-it-py[linkify]>=3.0",
    "nh3>=0.2",
    "Pillow>=11.0",
    "pillow-heif>=1.2",
    "django-storages[s3]>=1.14",
    "workos>=5.0",
    "sentry-sdk[django]>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "django-stubs-ext>=6.0.3",
    "django-stubs[compatible-mypy]>=6.0.3",
    "import-linter>=2.11",
    "libcst>=1.8.6",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-django>=4.9",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*/migrations/*",
    "/media",  # MEDIA_ROOT at backend/media — anchored so apps/media/ is still linted
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Mirrors flipfix (~/dev/flipfix) so both Django projects share a linting surface.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DJ",     # flake8-django
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "DTZ",    # flake8-datetimez (naive datetime bugs)
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PGH",    # pygrep-hooks (blanket noqa/type-ignore)
    "ISC",    # flake8-implicit-str-concat
    "RUF100", # unused-noqa
    "RUF059", # unused-unpacked-variable
    "ANN401", # no Any/object in annotations
]
ignore = [
    "E501",  # Line too long — handled by formatter
    "DJ001", # Avoid nullable CharField — common Django pattern
    "S101",  # Use of assert — okay in tests (also per-file-ignored below)
    "S311",  # Use of random — not cryptographic in this app
    "PT019", # Underscore-prefix fixtures are the pytest idiom for side-effect-only fixtures
    "SIM118", # Django SessionStore has .keys() but non-dict iteration
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = ["S101", "S106", "S603", "S607"]  # asserts, hardcoded test passwords, subprocess in tests
"conftest.py" = ["S101"]
"manage.py" = ["T20"]
"apps/*/management/commands/*.py" = ["T20", "S603", "S607", "B904"]  # print, subprocess, raise-from in commands
"scripts/*.py" = ["T201"]
"**/__init__.py" = ["F401"]  # re-exports from barrel modules are the whole point of __init__.py

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Import boundary enforcement — see docs/AppBoundaries.md for the prose spec.
# Run with `lint-imports` (wired into scripts/lint). Contracts translate the
# app dependency tiers and peer-isolation rules into checkable form.
[tool.importlinter]
root_packages = ["apps"]

# The vertical dependency spine. Higher tiers may import lower ones; lower may
# not import higher; pipe-separated names are independent siblings at one level.
# Media is NOT listed here — its peer-isolation rule is asymmetric (provenance
# may import citation, but media internals may import neither) and is enforced
# by the two forbidden contracts below.
[[tool.importlinter.contracts]]
name = "App layer tiers"
type = "layers"
layers = [
    "apps.kiosk",
    "apps.catalog",
    "apps.provenance",
    "apps.citation",
    "apps.accounts",
    "apps.core",
]
ignore_imports = [
    # --- Tests are exempt (mirrors the frontend's test-file boundary policy) ---
    # A test for one app routinely imports another app's models and factories.
    "apps.*.tests.** -> apps.**",
    # --- Page-API carve-out (permanent) ---------------------------------
    # Page endpoints intentionally cross tiers to compose a route's full
    # render payload. See docs/AppBoundaries.md § Exception: Page API endpoints.
    "apps.accounts.api.* -> apps.provenance.**",
    "apps.core.api.admin_dashboard_page -> apps.**",
    # --- BASELINE: existing violations to fix; do NOT add to this list ---
    "apps.provenance.api -> apps.catalog.models",
    "apps.core.api_helpers -> apps.accounts.models",
    "apps.core.middleware.sentry_scope -> apps.accounts.models",
]

# Media internals (storage/processing/schemas/models) are peer-isolated from
# the citation/provenance data apps. The one sanctioned crack is
# media.models -> provenance.models for ClaimControlledModel.
[[tool.importlinter.contracts]]
name = "Media internals do not reach into the data apps"
type = "forbidden"
source_modules = [
    "apps.media.storage",
    "apps.media.processing",
    "apps.media.schemas",
    "apps.media.models",
]
forbidden_modules = [
    "apps.provenance",
    "apps.citation",
]
ignore_imports = [
    # Surgical exception: media_attachment is a claim field, so every
    # MediaSupportedModel is structurally a ClaimControlledModel.
    "apps.media.models.base -> apps.provenance.models",
]

# The reverse direction: the data apps must not depend on media. Direct-only:
# the indirect chain provenance -> catalog -> media is the provenance -> catalog
# baseline issue above, not a provenance -> media dependency.
[[tool.importlinter.contracts]]
name = "Data apps do not depend on media"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "apps.provenance",
    "apps.citation",
]
forbidden_modules = ["apps.media"]

# Domain models are the bottom of each app's internal stack: they must not reach
# up into the HTTP/serialization layer. Direct-only — an indirect models -> X ->
# api chain is X's problem, caught by the api-leaf contract below.
[[tool.importlinter.contracts]]
name = "Domain models do not import the api/schema layer"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "apps.core.models",
    "apps.accounts.models",
    "apps.catalog.models",
    "apps.provenance.models",
    "apps.citation.models",
    "apps.media.models",
    "apps.kiosk.models",
]
forbidden_modules = [
    "apps.core.api",
    "apps.accounts.api",
    "apps.catalog.api",
    "apps.provenance.api",
    "apps.citation.api",
    "apps.media.api",
    "apps.kiosk.api",
    "apps.core.schemas",
    "apps.accounts.schemas",
    "apps.citation.schemas",
    "apps.media.schemas",
    "apps.provenance.schemas",
]

# Test-only helpers must never be imported by production code. test_factories
# encode test-fixture invariants; importing them from app code ships test
# scaffolding into the runtime path. One contract per factory: a forbidden
# module cannot be a descendant of its source, so each sources all apps EXCEPT
# the one that owns the factory (which covers every cross-app leak; a same-app
# self-import is the only residual gap and is trivially caught in review).
[[tool.importlinter.contracts]]
name = "Production code does not import accounts test factories"
type = "forbidden"
source_modules = [
    "apps.core",
    "apps.catalog",
    "apps.citation",
    "apps.provenance",
    "apps.media",
    "apps.kiosk",
]
forbidden_modules = ["apps.accounts.test_factories"]
ignore_imports = ["apps.*.tests.** -> apps.accounts.test_factories"]

[[tool.importlinter.contracts]]
name = "Production code does not import provenance test factories"
type = "forbidden"
source_modules = [
    "apps.core",
    "apps.accounts",
    "apps.catalog",
    "apps.citation",
    "apps.media",
    "apps.kiosk",
]
forbidden_modules = ["apps.provenance.test_factories"]
ignore_imports = ["apps.*.tests.** -> apps.provenance.test_factories"]

# The api/ layer is a leaf: it composes the domain layers below into HTTP
# endpoints, so the domain must not import back into it. Source is enumerated
# (forbidden cannot be a descendant of source) — this list also documents what
# counts as catalog's domain layer. Catalog has a multi-module api/ package; the
# core api/ package gets its own leaf contract below, and the remaining apps are
# single api.py modules that are leaves by construction. Domain logic stranded
# under catalog/api/ is baselined for burn-down (see docs/AppBoundaries.md).
[[tool.importlinter.contracts]]
name = "The api layer is a leaf"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "apps.catalog.models",
    "apps.catalog.services",
    "apps.catalog.resolve",
    "apps.catalog.ingestion",
    "apps.catalog.claims",
    "apps.catalog.cache",
    "apps.catalog.naming",
    "apps.catalog.authz",
    "apps.catalog.signals",
]
forbidden_modules = ["apps.catalog.api"]

# The ingest system (ingestion/) is the bulk catalog write path — a top-level
# consumer, not a dependency. The rest of catalog must not import it; only the
# management commands that drive ingest (manage.py ingest_patches / pull_patches)
# may, and they live outside this source list as the orchestration entrypoint.
[[tool.importlinter.contracts]]
name = "Catalog domain does not import the ingest system"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "apps.catalog.models",
    "apps.catalog.claims",
    "apps.catalog.resolve",
    "apps.catalog.services",
    "apps.catalog.cache",
    "apps.catalog.naming",
    "apps.catalog.signals",
    "apps.catalog.authz",
    "apps.catalog.api",
]
forbidden_modules = ["apps.catalog.ingestion"]
ignore_imports = ["apps.catalog.*.tests.** -> apps.catalog.ingestion.**"]

# The forward direction (mirror of the contract above): the ingest system must
# not reach back into the catalog domain. ingestion/ depends only on core,
# provenance and citation; its remaining catalog imports are a burn-down list,
# severed step by step (generic claim helpers -> provenance, the soft-delete
# walk -> core, resolution inverted into a provenance registry). When the list
# reaches zero the boundary is sealed and the ingest system can move to its own
# app. forbidden_modules enumerates the full catalog domain (the mirror of the
# reverse contract's source list) so a NEW coupling to any catalog package is
# caught, not just today's offenders — it is NOT scoped to currently-imported
# packages. apps.catalog.api is omitted: it is governed by the api-leaf
# contract (whose ingest soft_delete baselines are now cleared). The domain set
# is enumerated rather than a single "apps.catalog" forbid because import-linter
# forbids a source from being a descendant of a forbidden module, and
# apps.catalog.ingestion is a descendant of apps.catalog.
[[tool.importlinter.contracts]]
name = "Ingest system does not import the catalog domain"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = ["apps.catalog.ingestion"]
forbidden_modules = [
    "apps.catalog.models",
    "apps.catalog.claims",
    "apps.catalog.resolve",
    "apps.catalog.services",
    "apps.catalog.cache",
    "apps.catalog.naming",
    "apps.catalog.signals",
    "apps.catalog.authz",
]
# No baselines: the ingest -> catalog couplings (the model-type bound and the
# resolution dispatch) are fully severed (Steps 1-2). The contract now enforces
# clean.

# The interactive claim-write core (catalog/api/claim_write.py) is the generic
# write engine: it must not import the catalog domain, so it stays reusable
# across domains and can later extract into its own app below catalog. The split
# from the domain spec-builders is what exposes this seam to import-linter, which
# is module-granular. See docs/AppBoundaries.md.
[[tool.importlinter.contracts]]
name = "Interactive claim-write core does not import the catalog domain"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = ["apps.catalog.api.claim_write"]
forbidden_modules = [
    "apps.catalog.models",
    "apps.catalog.claims",
    "apps.catalog.resolve",
    "apps.catalog.services",
    "apps.catalog.cache",
    "apps.catalog.naming",
    "apps.catalog.signals",
    "apps.catalog.authz",
    "apps.catalog.exceptions",
]
ignore_imports = [
    # --- BASELINE: claim_write -> catalog couplings to sever; delete each as the
    # step that resolves it lands. Do NOT add to this list. ---
    # raise_form_error raises StructuredValidationError; clears when that error
    # relocates to core.
    "apps.catalog.api.claim_write -> apps.catalog.exceptions",
]

# The generic resolver core — scalar/bulk claim projection (_entities), its
# coercion/FK/constraint helpers (_helpers), and the read-side payload
# vocabulary (_claim_values) — is domain-agnostic substrate that merely lives
# in catalog: it names no concrete model and drives entirely off claim-field
# introspection (get_claim_fields, _meta). Forbidding it from importing the
# catalog domain turns the claim-resolution plan's load-bearing premise ("Tier
# 1 is already fully generic") into an enforced invariant, so a stray `from
# ..models import …` can't silently re-couple it, and the eventual hoist to the
# substrate stays a near-trivial move. This is a ratchet on what is already
# true today (green, no baselines) — NOT the model-driven resolver engine,
# which awaits the deferred relationship-declaration vocabulary. The
# relationship/dispatch resolvers (_relationships, _dispatch, __init__) still
# bind MachineModel and are deliberately out of scope; the dispatch seam is
# restructured by ModelDrivenClaimWrite.md's "Invert resolution" step. See
# docs/plans/model_driven_metadata/ModelDrivenClaimResolution.md.
[[tool.importlinter.contracts]]
name = "Generic resolver core does not import the catalog domain"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "apps.catalog.resolve._entities",
    "apps.catalog.resolve._helpers",
    "apps.catalog.resolve._claim_values",
]
forbidden_modules = [
    "apps.catalog.models",
    "apps.catalog.claims",
    "apps.catalog.services",
    "apps.catalog.cache",
    "apps.catalog.naming",
    "apps.catalog.signals",
    "apps.catalog.authz",
    "apps.catalog.exceptions",
]

# core has a multi-module api/ package (like catalog); the same leaf rule applies.
[[tool.importlinter.contracts]]
name = "The core api layer is a leaf"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "apps.core.types",
    "apps.core.exceptions",
    "apps.core.models",
    "apps.core.authz",
    "apps.core.autocomplete",
    "apps.core.markdown",
    "apps.core.wikilinks",
    "apps.core.search",
    "apps.core.sitemap",
    "apps.core.pagination",
    "apps.core.rate_limits",
    "apps.core.validators",
    "apps.core.licensing",
    "apps.core.schemas",
    "apps.core.entity_types",
    "apps.core.api_helpers",
    "apps.core.middleware",
]
forbidden_modules = ["apps.core.api"]

# The patch system is a compiler front end: it lowers YAML patches to an
# IngestPlan (the IR), which the ingest back end (apply/) executes. The split is
# load-bearing — new patch behavior belongs in the front end against the IR, not
# as a fork of apply_plan. See docs/DataArchitecture.md.
[[tool.importlinter.contracts]]
name = "Patch front end does not depend on the ingest back end"
type = "forbidden"
source_modules = ["apps.catalog.ingestion.patches"]
forbidden_modules = ["apps.catalog.ingestion.apply"]

# Media internal layering: a vertical stack from constants/models at the bottom
# up to the api composition layer. This also enforces that media.api is a leaf
# (nothing below it imports it). The cross-app media.models -> provenance.models
# crack is governed by the media peer-isolation contract above, not here.
[[tool.importlinter.contracts]]
name = "Media internal layers"
type = "layers"
layers = [
    "apps.media.api",
    "apps.media.authz",
    "apps.media.processing | apps.media.storage | apps.media.schemas | apps.media.helpers",
    "apps.media.models",
    "apps.media.constants",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
exclude = [
    "migrations/",
    "\\.venv/",
    "^media/",  # MEDIA_ROOT at backend/media — anchored so apps/media/ is still type-checked
    "^cache/",
]
warn_unused_ignores = true
warn_redundant_casts = true
# Barrel __init__.py files re-export symbols via `from X import Y`. Treat these
# as intentional public API rather than requiring `__all__` on every barrel.
implicit_reexport = true

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true

# Migrations are generated; don't type-check them.
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

# Tests and conftest: relax annotation requirements for fixtures. Type correctness
# of the code under test still matters; per-function annotations in tests do not.
[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# Third-party libraries without py.typed markers or upstream stubs.
# Suppresses import-untyped errors at the import site; the libraries themselves
# are still treated as Any at use sites.
[[tool.mypy.overrides]]
module = ["pillow_heif", "constance", "constance.*"]
ignore_missing_imports = true
